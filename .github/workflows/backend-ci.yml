name: Backend CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test API
        working-directory: services/api
        run: mvn test

