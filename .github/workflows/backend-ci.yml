name: Backend CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - "packages/schemas/**"
      - "packages/test-fixtures/verification/**"
      - "services/math-verifier/**"
      - "infra/local/minio-test/**"
      - "Makefile"
      - "scripts/quality/check_prompt_immutability.py"
      - "scripts/quality/test_prompt_immutability.py"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve existing prompt and schema versions
        if: github.event_name == 'pull_request'
        env:
          PROMPT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/quality/check_prompt_immutability.py --base-ref "$PROMPT_BASE_SHA"
      - name: Test prompt immutability gate
        run: python3 -m unittest discover -s scripts/quality -p test_prompt_immutability.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build pinned MinIO test image
        run: make test-minio-image
      - name: Provision Python verifier for cross-runtime contract
        run: |
          python3 -m venv services/math-verifier/.venv
          services/math-verifier/.venv/bin/python -m pip install -e 'services/math-verifier[dev]'
      - name: Test API
        working-directory: services/api
        env:
          VERIFIEDAI_MATH_WIRE: "true"
          VERIFIEDAI_VERIFIER_PYTHON: ${{ github.workspace }}/services/math-verifier/.venv/bin/python
        run: mvn -Dverifiedai.test.minio-image=verified-ai/minio-test:2024-07-16-3535197 test

