name: Math Verifier CI

on:
  pull_request:
    paths:
      - "services/math-verifier/**"
      - "packages/schemas/math-visualization*"
      - "evaluations/golden-datasets/visualizations/**"
      - "scripts/quality/*math_visualization*"
      - "packages/schemas/verification-execution*.schema.json"
      - "packages/schemas/calculus-execution*.schema.json"
      - "packages/schemas/numeric-diagnostic*.schema.json"
      - "packages/schemas/*-v2.schema.json"
      - "packages/test-fixtures/verification/**"
      - ".github/workflows/math-verifier-ci.yml"
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verifier
        working-directory: services/math-verifier
        run: python -m pip install -e ".[dev]"
      - name: Test verifier
        working-directory: services/math-verifier
        run: python -m pytest

      - name: Visualization contracts and semantic golden evaluation
        run: |
          mkdir -p .generated/sprint-6-9-ci
          python scripts/quality/check_math_visualization_contracts.py
          python scripts/quality/evaluate_math_visualization.py .generated/sprint-6-9-ci/golden.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-6-9-linux-golden
          path: .generated/sprint-6-9-ci
