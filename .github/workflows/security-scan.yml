name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Test secret scanner failure handling
        run: python3 -m unittest discover -s scripts/security -p test_secret_scan.py
      - name: Secret scan
        run: scripts/security/secret_scan.sh
      - name: Repository hygiene
        run: test -z "$(find . -name '.DS_Store' -print)"
