name: verified-ai-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verified_ai}
      POSTGRES_USER: ${POSTGRES_USER:-verified_ai_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform-internal

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - platform-internal

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_password_change_me}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://localhost:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null 2>&1 && mc ready local",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data
    networks:
      - platform-internal

  math-verifier:
    build:
      context: ./services/math-verifier
    environment:
      APP_ENV: local
      MATH_VERIFIER_INTERNAL_TOKEN: ${MATH_VERIFIER_INTERNAL_TOKEN:-local_math_verifier_token_change_me}
    ports:
      - "127.0.0.1:${MATH_VERIFIER_PORT:-8090}:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - platform-internal

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: local
      API_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-verified_ai}
      POSTGRES_USER: ${POSTGRES_USER:-verified_ai_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROBLEM_ASSETS_BUCKET: ${PROBLEM_ASSETS_BUCKET:-verified-ai-problem-assets-local}
      PROBLEM_ASSETS_S3_ENDPOINT: http://minio:9000
      PROBLEM_ASSETS_S3_REGION: us-east-1
      PROBLEM_ASSETS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_local}
      PROBLEM_ASSETS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_password_change_me}
      PROBLEM_ASSETS_S3_PATH_STYLE: "true"
      MATH_VERIFIER_BASE_URL: http://math-verifier:8090
      MATH_VERIFIER_INTERNAL_TOKEN: ${MATH_VERIFIER_INTERNAL_TOKEN:-local_math_verifier_token_change_me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      math-verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - platform-internal

volumes:
  postgres-data:
  minio-data:

networks:
  platform-internal:
    driver: bridge
