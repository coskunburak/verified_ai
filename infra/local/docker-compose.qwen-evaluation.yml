# Isolated owner-run Linux/NVIDIA evaluation. Never included by the platform's default compose file.
services:
  qwen-evaluation:
    image: vllm/vllm-openai:v0.17.1@${QWEN_RUNTIME_DIGEST:?owner must approve the exact image digest}
    pull_policy: never
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VLLM_API_KEY: ${QWEN_SERVICE_CREDENTIAL:?owner must supply a service credential}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      HF_HOME: /runtime-cache/huggingface
      VLLM_CACHE_ROOT: /runtime-cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /runtime-cache/torch
    volumes:
      - ${QWEN_WEIGHTS_DIR:?owner must download and verify the pinned snapshot separately}:/model:ro
      - ${QWEN_RUNTIME_CACHE_DIR:?owner must supply an isolated runtime cache}:/runtime-cache
    command:
      - --model
      - /model
      - --tokenizer
      - /model
      - --revision
      - 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      - --tokenizer-revision
      - 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      - --served-model-name
      - qwen3.5-4b-851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a-bf16-vllm0171
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "8192"
      - --gpu-memory-utilization
      - "0.80"
      - --limit-mm-per-prompt
      - '{"image":0,"video":0}'
      - --generation-config
      - vllm
      - --no-enable-prefix-caching
      - --no-enable-log-requests
      - --no-enable-log-outputs
      - --disable-uvicorn-access-log
      - --enable-request-id-headers
      - --host
      - 0.0.0.0
    shm_size: 2gb
    mem_limit: 32g
    cpus: 8
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=8g
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"
    stop_grace_period: 35s
    networks: [inference-isolated]
networks:
  inference-isolated:
    internal: true
