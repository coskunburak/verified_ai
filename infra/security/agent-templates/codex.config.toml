# Owner User-level Codex Configuration (~/.codex/config.toml)
# Install: cp infra/security/agent-templates/codex.config.toml ~/.codex/config.toml && chmod 600 ~/.codex/config.toml
#
# NOTE: To enforce system-level immutable requirements that cannot be bypassed by CLI flags,
# install /etc/codex/requirements.toml from infra/security/agent-templates/codex.requirements.toml.

model = "o3"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
default_permissions = "verified_ai_isolated"
allow_login_shell = false

[sandbox_workspace_write]
network_access = false

[permissions.verified_ai_isolated]
extends = ":workspace"

[permissions.verified_ai_isolated.filesystem]
glob_scan_max_depth = 4
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.gnupg" = "deny"
"~/.codex" = "deny"
"~/.claude" = "deny"
"~/.gemini" = "deny"

[permissions.verified_ai_isolated.filesystem.":project_roots"]
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.p12" = "deny"

[shell_environment_policy]
inherit = "none"
include_only = [
    "PATH",
    "HOME",
    "USER",
    "SHELL",
    "TERM",
    "LANG",
    "LC_ALL",
    "JAVA_HOME",
    "TMPDIR",
    "APP_ENV"
]
exclude = [
    "*KEY*",
    "*SECRET*",
    "*TOKEN*",
    "*PASSWORD*",
    "*CREDENTIAL*",
    "*AUTH*",
    "OPENAI_*",
    "ANTHROPIC_*",
    "GEMINI_*",
    "AWS_*",
    "GITHUB_*",
    "APPLE_*",
    "MATH_VERIFIER_INTERNAL_TOKEN"
]
