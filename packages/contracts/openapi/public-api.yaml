openapi: 3.1.0
info:
  title: Verified AI Public API
  version: 0.1.0

paths:
  /api/v1/problem-sessions:
    get:
      summary: List problem session history
      description: >
        Returns a keyset-paginated history of problem sessions for the
        authenticated owner, ordered by updatedAt descending and session id
        descending. This endpoint is read-only and never invokes AI providers,
        recovery engines, classification, canonicalization, parsing, recognition,
        or preprocessing side effects.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Problem session history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSessionHistoryResponse"
        "400":
          description: Cursor is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}:
    get:
      summary: Get problem session recovery detail
      description: >
        Returns the current durable recovery projection for one problem session.
        The selected parse authority is problem_sessions.current_parse_id; current
        canonical and classification summaries are only authoritative when they
        match that selected parse lineage. This endpoint is read-only and never
        invokes AI providers or mutates workflow jobs.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Problem session recovery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSessionDetailResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Selected parse lineage is ambiguous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}/classification:
    post:
      summary: Request canonical problem classification
      description: >
        Creates or reuses a durable PROBLEM_CLASSIFY job for the current
        CanonicalProblem revision. Classification consumes only the current
        canonical problem. It does not consume raw OCR/image/provider output,
        solve the problem, verify a solution, update mastery, mutate curriculum,
        or create taxonomy identifiers.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Classification job accepted or existing equivalent job reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemClassificationResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Required entitlement is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Current canonical problem is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Classification route is unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    get:
      summary: Get classification state for current canonical problem
      description: >
        Returns NOT_STARTED when the current CanonicalProblem has no
        classification job. Historical classifications belonging to older
        canonical revisions are never returned as authoritative state.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current canonical classification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemClassificationResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Current canonical problem is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/platform/health:
    get:
      summary: Public platform liveness check
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealthResponse"

  /api/v1/platform/readiness:
    get:
      summary: Public platform readiness check
      responses:
        "200":
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealthResponse"
        "503":
          description: API is alive but not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealthResponse"

  /api/v1/auth/apple:
    post:
      summary: Exchange a verified Apple identity credential for a platform session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignInRequest"
      responses:
        "200":
          description: Platform session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Apple identity token is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/auth/email/sign-up:
    post:
      summary: Create an email/password account and issue a platform session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAuthRequest"
      responses:
        "200":
          description: Platform session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Email address is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Password does not meet platform requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/auth/email/sign-in:
    post:
      summary: Authenticate an email/password account and issue a platform session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAuthRequest"
      responses:
        "200":
          description: Platform session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Email or password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/auth/guest:
    post:
      summary: Continue without registration by issuing an anonymous platform session
      responses:
        "200":
          description: Platform session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Refresh token is revoked, expired, invalid, or reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/auth/session:
    get:
      summary: Return the current authenticated user/session identifiers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/auth/logout:
    post:
      summary: Revoke the current backend session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/account:
    get:
      summary: Return the current authenticated account state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStateResponse"
        "401":
          description: Access token is invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/data-exports:
    post:
      summary: Request a retention-aware account data export for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "202":
          description: Export prepared for download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportResponse"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/data-exports/{exportId}:
    get:
      summary: Return status for a current user's data export
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportResponse"
        "404":
          description: Export was not found for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/data-exports/{exportId}/content:
    get:
      summary: Download a ready current-user data export JSON document
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export JSON content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportContent"
        "404":
          description: Export was not found for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "410":
          description: Export expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/deletion-request:
    get:
      summary: Return the current authenticated account deletion state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current deletion request state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"

    post:
      summary: Request account deletion for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "202":
          description: Account placed in deletion-requested state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/deletion-request/confirm:
    post:
      summary: Confirm and execute current-user account deletion
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmationRequest"
      responses:
        "200":
          description: Account deleted, sessions revoked, and local client must discard credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
        "422":
          description: Confirmation text is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/learning-profile:
    get:
      summary: Return the current authenticated learner profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current learner profile or NOT_STARTED profile state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProfileResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    patch:
      summary: Update the current authenticated learner profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLearningProfileRequest"
      responses:
        "200":
          description: Updated learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProfileResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Expected profile version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Profile validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/entitlements:
    get:
      summary: Return the backend-authoritative current entitlement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current entitlement and currently granted capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/uploads/presign:
    post:
      summary: Reserve a private user-owned problem asset upload and return a presigned PUT URL
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignProblemAssetUploadRequest"
      responses:
        "201":
          description: Upload reservation created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignProblemAssetUploadResponse"
        "400":
          description: Idempotency key or upload request body is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow upload reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Idempotency key was reused with different upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          description: Upload is larger than the Sprint 4.2 server limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Content type, checksum, crop, or asset metadata is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/uploads/{uploadId}/complete:
    post:
      summary: Complete a reserved problem asset upload after backend object verification
      security:
        - bearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Upload verified and marked AVAILABLE, or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteProblemAssetUploadResponse"
        "400":
          description: Idempotency key is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Upload reservation was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Upload object size or checksum does not match the reservation, or state is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "410":
          description: Upload reservation expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Uploaded object is missing or has unsupported content metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-assets/{assetId}/preprocess:
    post:
      summary: Generate backend-owned preprocessing derivatives and capture quality evidence
      description: Synchronously preprocesses an AVAILABLE image asset for Sprint 4.4 recognition input. PDF sources return a recoverable FAILED preprocessing lifecycle response in Sprint 4.3; OCR, parsing, solving, and verification are out of scope.
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current preprocessing lifecycle result, including recoverable FAILED outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemAssetPreprocessingResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow preprocessing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem asset was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Source asset is not AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Source object is missing or preprocessing metadata is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-assets/{assetId}/preprocessing:
    get:
      summary: Read backend-owned preprocessing derivatives and quality evidence for an asset
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current preprocessing lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemAssetPreprocessingResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem asset was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}/recognition:
    post:
      summary: Request raw vision/OCR recognition evidence for a preprocessed problem session
      description: Creates or reuses a durable VISION_PARSE recognition job for the selected OCR-optimized derivative. The endpoint does not parse, solve, classify, verify, or produce canonical mathematics.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Recognition job accepted or existing job reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemRecognitionResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow recognition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: No selected READY OCR-optimized recognition derivative is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    get:
      summary: Poll raw recognition job status and normalized recognition evidence
      description: Returns safe job status and normalized recognition blocks for the authenticated owner. Raw provider output and provider request details are not exposed.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current recognition status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemRecognitionResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}/parse:
    post:
      summary: Request structured problem parsing for durable recognition evidence
      description: Creates or reuses a durable PROBLEM_NORMALIZE parse job for the current recognized evidence revision. The endpoint does not solve, verify, create a safe AST, assign primary skill, assign difficulty, or expose raw provider output.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Parse job accepted or existing job reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemParseResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow parsing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: No durable recognition evidence is available for parsing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    get:
      summary: Poll structured problem parse job status and normalized parse output
      description: Returns safe parser lifecycle state and normalized ProblemParse for the authenticated owner. Raw parser output and provider request details are not exposed.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current parse status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemParseResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}/parse-review:
    get:
      summary: Return the selected parse for user review
      description: Returns the selected ProblemParse and safe normalized parse document for the authenticated owner. Raw parser output, provider request data, request hashes, and idempotency keys are not exposed.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Selected parse review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemParseReviewResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow parse review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: No selected parse is available for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}/parse-revisions:
    post:
      summary: Create a user-corrected parse revision
      description: Creates an idempotent USER ProblemParse revision from the selected parse and selects it for future canonicalization. Server validation owns parse schema normalization and canonicalization remains a separate explicit step.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProblemParseCorrectionRequest"
      responses:
        "201":
          description: User-corrected parse revision created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProblemParseCorrectionResponse"
        "400":
          description: Correction request is malformed or the Idempotency-Key is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow parse correction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Selected parse changed or idempotency key conflicts with different content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          description: Corrected parse document is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Corrected parse document is semantically invalid or unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    get:
      summary: Return parse revision history for a problem session
      description: Returns AI and USER parse revision metadata for the authenticated owner. Correction request hashes and idempotency keys are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Parse revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemParseRevisionHistoryResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}/canonicalize:
    post:
      summary: Create the safe canonical mathematical representation for an accepted parse
      description: Converts the selected supported ProblemParse into a durable Layer 4 canonical problem and verifier-input representation. This endpoint does not solve, verify, classify skill, assign difficulty, or expose raw parser output.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Canonical problem created or existing canonical problem reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalProblemResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow canonicalization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Problem parse is missing or outside canonical v1 scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Parser expression cannot be safely canonicalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/problem-sessions/{sessionId}/canonical-problem:
    get:
      summary: Return canonical problem display metadata for the authenticated owner
      description: Returns lifecycle-safe canonical problem metadata and display fields for the currently selected parse. Internal AST and verifier endpoints are not exposed to the mobile client.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current canonical problem summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalProblemResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Canonical problem or problem session was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/billing/apple/configuration:
    get:
      summary: Return backend-owned App Store purchase configuration for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Apple billing configuration, including the stable App Account Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleBillingConfigurationResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/me/billing/apple/transactions:
    post:
      summary: Submit StoreKit 2 signed transaction evidence for backend verification
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 96
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplePurchaseEvidenceRequest"
      responses:
        "200":
          description: Verified purchase evidence persisted and entitlement recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplePurchaseEvidenceResponse"
        "400":
          description: Purchase evidence is missing, invalid, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Idempotency key or Apple transaction ownership conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/webhooks/apple/app-store:
    post:
      summary: Receive App Store Server Notifications V2 signedPayload events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleAppStoreNotificationRequest"
      responses:
        "200":
          description: Notification verified, persisted, and processed or safely deduplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleNotificationIngestionResponse"
        "400":
          description: Notification signedPayload is missing or fails Apple signed-data verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProblemSessionHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProblemSessionSummaryResponse"
        nextCursor:
          type: [string, "null"]
          maxLength: 256

    ProblemSessionSummaryResponse:
      type: object
      additionalProperties: false
      required:
        - problemSessionId
        - status
        - stage
        - inputMode
        - nextAction
        - retryable
        - reviewRequired
        - createdAt
        - updatedAt
      properties:
        problemSessionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProblemSessionStatus"
        stage:
          $ref: "#/components/schemas/ProblemSessionStage"
        inputMode:
          type: string
        nextAction:
          $ref: "#/components/schemas/ProblemSessionNextAction"
        retryable:
          type: boolean
        reviewRequired:
          type: boolean
        currentParseRevision:
          type: [integer, "null"]
          minimum: 1
        currentParseSource:
          type: [string, "null"]
          enum:
            - AI
            - USER
            - null
        classificationStatus:
          type: [string, "null"]
          enum:
            - CLASSIFIED
            - REVIEW_REQUIRED
            - UNKNOWN
            - UNSUPPORTED
            - null
        primarySkillId:
          type: [string, "null"]
        difficulty:
          type: [string, "null"]
          enum:
            - EASY
            - MEDIUM
            - HARD
            - null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time

    ProblemSessionDetailResponse:
      type: object
      additionalProperties: false
      required:
        - problemSessionId
        - status
        - stage
        - inputMode
        - nextAction
        - retryable
        - reviewRequired
        - failureCode
        - currentParse
        - canonicalProblem
        - classification
        - activeJob
        - createdAt
        - updatedAt
        - version
      properties:
        problemSessionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProblemSessionStatus"
        stage:
          $ref: "#/components/schemas/ProblemSessionStage"
        inputMode:
          type: string
        nextAction:
          $ref: "#/components/schemas/ProblemSessionNextAction"
        retryable:
          type: boolean
        reviewRequired:
          type: boolean
        failureCode:
          type: [string, "null"]
        currentParse:
          anyOf:
            - $ref: "#/components/schemas/ProblemSessionCurrentParseSummary"
            - type: "null"
        canonicalProblem:
          anyOf:
            - $ref: "#/components/schemas/ProblemSessionCanonicalSummary"
            - type: "null"
        classification:
          anyOf:
            - $ref: "#/components/schemas/ProblemSessionClassificationSummary"
            - type: "null"
        activeJob:
          anyOf:
            - $ref: "#/components/schemas/ProblemSessionActiveJob"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 0

    ProblemSessionCurrentParseSummary:
      type: object
      additionalProperties: false
      required:
        - parseId
        - revision
        - source
        - supportStatus
        - reviewRequired
      properties:
        parseId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        source:
          type: string
          enum:
            - AI
            - USER
        supportStatus:
          type: string
          enum:
            - SUPPORTED
            - REVIEW_REQUIRED
            - UNSUPPORTED
        reviewRequired:
          type: boolean

    ProblemSessionCanonicalSummary:
      type: object
      additionalProperties: false
      required:
        - canonicalProblemId
        - canonicalRevision
        - problemParseId
        - problemParseRevision
        - problemType
        - taskType
      properties:
        canonicalProblemId:
          type: string
          format: uuid
        canonicalRevision:
          type: integer
          minimum: 1
        problemParseId:
          type: string
          format: uuid
        problemParseRevision:
          type: integer
          minimum: 1
        problemType:
          type: string
        taskType:
          type: string

    ProblemSessionClassificationSummary:
      type: object
      additionalProperties: false
      required:
        - classificationId
        - revision
        - status
      properties:
        classificationId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - CLASSIFIED
            - REVIEW_REQUIRED
            - UNKNOWN
            - UNSUPPORTED
        primarySkillId:
          type: [string, "null"]
        difficulty:
          type: [string, "null"]
          enum:
            - EASY
            - MEDIUM
            - HARD
            - null
        reviewReason:
          type: [string, "null"]

    ProblemSessionActiveJob:
      type: object
      additionalProperties: false
      required:
        - type
        - jobId
        - status
        - attemptCount
        - maxAttempts
      properties:
        type:
          type: string
          enum:
            - RECOGNITION
            - PARSE
            - CLASSIFICATION
        jobId:
          type: string
          format: uuid
        status:
          type: string
        attemptCount:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 0
        failureCode:
          type: [string, "null"]

    ProblemSessionStatus:
      type: string
      enum:
        - CREATED
        - ASSET_UPLOADED
        - PARSING
        - PARSED
        - REVIEW_REQUIRED
        - FAILED

    ProblemSessionStage:
      type: string
      enum:
        - AWAITING_UPLOAD
        - PREPROCESSING
        - RECOGNITION
        - PARSING
        - PARSE_REVIEW
        - CANONICALIZATION
        - CLASSIFICATION
        - READY_FOR_SOLVE
        - TERMINAL

    ProblemSessionNextAction:
      type: string
      enum:
        - NONE
        - RESUME_UPLOAD
        - START_PREPROCESSING
        - RETRY_PREPROCESSING
        - START_RECOGNITION
        - WAIT_RECOGNITION
        - RETRY_RECOGNITION
        - START_PARSE
        - WAIT_PARSE
        - RETRY_PARSE
        - REVIEW_PARSE
        - CANONICALIZE
        - START_CLASSIFICATION
        - WAIT_CLASSIFICATION
        - RETRY_CLASSIFICATION
        - READY_FOR_SOLVE
        - RECAPTURE_OR_REIMPORT
        - UNSUPPORTED

    ProblemClassificationResponse:
      type: object
      additionalProperties: false
      required:
        - problemSessionId
        - canonicalProblemId
        - canonicalProblemRevision
        - jobStatus
        - capability
        - attemptCount
        - maxAttempts
        - ontologyVersion
        - projectionVersion
        - schemaVersion
        - secondarySkillIds
        - difficultyPolicyVersion
        - confidencePolicyVersion
      properties:
        classificationJobId:
          type: [string, "null"]
          format: uuid

        problemSessionId:
          type: string
          format: uuid

        canonicalProblemId:
          type: string
          format: uuid

        canonicalProblemRevision:
          type: integer
          minimum: 1

        jobStatus:
          type: string
          enum:
            - NOT_STARTED
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED_RETRYABLE
            - FAILED_TERMINAL

        capability:
          type: string
          const: PROBLEM_CLASSIFY

        attemptCount:
          type: integer
          minimum: 0

        maxAttempts:
          type: integer
          minimum: 0

        lastErrorCode:
          type: [string, "null"]

        lastFailureClass:
          type: [string, "null"]

        classificationId:
          type: [string, "null"]
          format: uuid

        classificationRevision:
          type: [integer, "null"]
          minimum: 1

        classificationSource:
          type: [string, "null"]
          enum:
            - AI
            - SYSTEM
            - null

        classificationStatus:
          type: [string, "null"]
          enum:
            - CLASSIFIED
            - REVIEW_REQUIRED
            - UNKNOWN
            - UNSUPPORTED
            - null

        reviewReason:
          type: [string, "null"]
          enum:
            - AMBIGUOUS_PRIMARY_SKILL
            - LOW_CLASSIFICATION_CONFIDENCE
            - UPSTREAM_RISK
            - ONTOLOGY_COVERAGE_GAP
            - INSUFFICIENT_SEMANTIC_EVIDENCE
            - null

        ontologyVersion:
          type: string

        projectionVersion:
          type: string

        schemaVersion:
          type: string

        subjectId:
          type: [string, "null"]

        topicId:
          type: [string, "null"]

        primarySkillId:
          type: [string, "null"]

        secondarySkillIds:
          type: array
          maxItems: 5
          items:
            type: string

        difficulty:
          type: [string, "null"]
          enum:
            - EASY
            - MEDIUM
            - HARD
            - null

        difficultyPolicyVersion:
          type: string

        confidenceBand:
          type: [string, "null"]
          enum:
            - MEDIUM
            - LOW
            - UNKNOWN
            - null
          description: >
            Backend-derived confidence. Sprint 4.7 V1 deliberately
            never emits HIGH.

        confidencePolicyVersion:
          type: string

        confidenceCalibration:
          type: [string, "null"]
          enum:
            - UNCALIBRATED
            - null

        provider:
          type: [string, "null"]

        model:
          type: [string, "null"]

        fallbackUsed:
          type: [boolean, "null"]

        createdAt:
          type: [string, "null"]
          format: date-time

        updatedAt:
          type: [string, "null"]
          format: date-time

        completedAt:
          type: [string, "null"]
          format: date-time

        classificationCreatedAt:
          type: [string, "null"]
          format: date-time

    AppleSignInRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
        authorizationCode:
          type: string
        nonce:
          type: string

    EmailAuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshSessionRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthSessionResponse:
      type: object
      required: [userId, sessionId, tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time

    CurrentSessionResponse:
      type: object
      required: [userId, sessionId]
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid

    LogoutResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [loggedOut]

    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED, DELETION_REQUESTED, DELETION_IN_PROGRESS, DELETED]

    AccountStateResponse:
      type: object
      required: [userId, status, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AccountStatus"
        createdAt:
          type: string
          format: date-time
        deletionRequestedAt:
          type: [string, "null"]
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time

    DataExportResponse:
      type: object
      required: [exportId, status, schemaVersion, requestedAt, expiresAt]
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
          enum: [READY, EXPIRED, FAILED]
        schemaVersion:
          type: string
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        downloadedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time

    DataExportContent:
      type: object
      required: [schemaVersion, generatedAt, account]
      additionalProperties: true
      properties:
        schemaVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        account:
          type: object
          additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        learningProfile:
          type: object
          additionalProperties: true
        billing:
          type: object
          additionalProperties: true

    DeletionRequestResponse:
      type: object
      required: [userId, status]
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AccountStatus"
