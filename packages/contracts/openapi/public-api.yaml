        '400': {$ref: '#/components/responses/ProblemBadRequest'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/exams/pre-exam-review/{examCode}:
    get:
      summary: Read private deterministic H-15 pre-exam-review
      security: [{bearerAuth: []}]
      parameters:
        - {name: examCode, in: path, required: true, schema: {type: string, enum: [TR_YKS_TYT_MATH, TR_YKS_AYT_MATH]}}
        - {name: If-None-Match, in: header, schema: {type: string}, description: Quoted entity tags; weak comparison and wildcard supported}
      responses:
        '200':
          description: Owner snapshot; date-only precision never supplies an exact countdown
          headers:
            ETag: {schema: {type: string}, description: Quoted resource-specific SHA-256}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreExamReviewSession'}
        '304':
          description: No body; reuse only an unexpired same-owner same-exam snapshot or retry unconditionally
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
        '400': {$ref: '#/components/responses/ProblemBadRequest'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '404': {$ref: '#/components/responses/ProblemNotFound'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
