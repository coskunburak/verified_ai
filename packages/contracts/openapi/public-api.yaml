openapi: 3.1.0
info:
  title: Verified AI Public API
  version: 0.1.0

paths:
  /v1/admin/exams/quality-gate:
    get:
      summary: Read-only fail-closed Phase 09 Exit Gate certification report (ROLE_ADMIN only)
      description: Requires JWT ROLE_ADMIN. Read-only evaluation over persisted Flyway schema history and owner-supplied evidence manifest; never triggers migrations, tests, benchmarks, or LLM calls. Stable machine error codes EXAM_QUALITY_GATE_EVIDENCE_UNAVAILABLE / EXAM_SESSION_FORBIDDEN.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Read-only Phase 09 Exit Gate report (BLOCKED, FAIL, or PASS)
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamQualityGateReport'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '429': {$ref: '#/components/responses/ProblemTooManyRequests'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/ProblemServiceUnavailable'}
  /api/v1/admin/exams/quality-gate:
    get:
      summary: Read-only fail-closed Phase 09 Exit Gate certification report (ROLE_ADMIN only)
      description: Requires JWT ROLE_ADMIN. Read-only evaluation over persisted Flyway schema history and owner-supplied evidence manifest; never triggers migrations, tests, benchmarks, or LLM calls. Stable machine error codes EXAM_QUALITY_GATE_EVIDENCE_UNAVAILABLE / EXAM_SESSION_FORBIDDEN.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Read-only Phase 09 Exit Gate report (BLOCKED, FAIL, or PASS)
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamQualityGateReport'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '429': {$ref: '#/components/responses/ProblemTooManyRequests'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/ProblemServiceUnavailable'}
  /v1/exams/sessions/{sessionId}/integrity-proof:
    get:
      summary: Issue session-scoped HKDF-SHA256 HMAC submission proof key over TLS (no-store)
      description: Owner-authenticated proof issuance bound to active/grace exam session. Never returns secrets when session is terminal or expired. Stable error codes EXAM_SESSION_FORBIDDEN, EXAM_SESSION_ALREADY_TERMINATED, EXAM_SESSION_EXPIRED, EXAM_INTEGRITY_CONFIGURATION_UNAVAILABLE.
      security: [{bearerAuth: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Session-scoped integrity proof metadata and ephemeral derived key
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamIntegrityProofResponse'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '404': {$ref: '#/components/responses/ProblemNotFound'}
        '409': {$ref: '#/components/responses/ProblemConflict'}
        '429': {$ref: '#/components/responses/ProblemTooManyRequests'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/ProblemServiceUnavailable'}
  /api/v1/exams/sessions/{sessionId}/integrity-proof:
    get:
      summary: Issue session-scoped HKDF-SHA256 HMAC submission proof key over TLS (no-store)
