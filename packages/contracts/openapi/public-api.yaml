              "type": "integer",
              "minimum": 1,
              "maximum": 12
            },
            "role": {
              "enum": [
                "INTERMEDIATE",
                "FINAL_ANSWER",
                "AMBIGUOUS"
              ]
            },
            "originalText": {
              "anyOf": [
                {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 256
                },
                {
                  "type": "null"
                }
              ]
            },
            "reviewedText": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            },
            "observationIds": {
              "type": "array",
              "items": {
                "type": "string",
                "format": "uuid"
              },
              "minItems": 0,
              "maxItems": 12,
              "uniqueItems": true
            },
            "normalizedStatement": {
              "anyOf": [
                {
                  "type": "string",
                  "maxLength": 1800
                },
                {
                  "type": "null"
                }
              ]
            },
            "normalizationStatus": {
              "enum": [
                "NORMALIZED",
                "UNSUPPORTED",
                "REVIEW_REQUIRED"
              ]
            },
            "reviewStatus": {
              "enum": [
                "CONFIRMED",
                "REQUIRED"
              ]
            }
          },
          "required": [
            "id",
            "index",
            "role",
            "originalText",
            "reviewedText",
            "observationIds",
            "normalizedStatement",
            "normalizationStatus",
            "reviewStatus"
          ],
          "allOf": [
            {
              "if": {
                "properties": {
                  "normalizationStatus": {
                    "const": "NORMALIZED"
                  }
                }
              },
              "then": {
                "properties": {
                  "normalizedStatement": {
                    "type": "string"
                  },
                  "reviewStatus": {
                    "const": "CONFIRMED"
                  }
                }
              },
              "else": {
                "properties": {
                  "normalizedStatement": {
                    "type": "null"
                  }
                }
              }
            },
            {
              "if": {
                "properties": {
                  "reviewStatus": {
                    "const": "REQUIRED"
                  }
                }
              },
              "then": {
                "properties": {
                  "normalizationStatus": {
                    "const": "REVIEW_REQUIRED"
                  }
                }
              }
            },
            {
              "if": {
                "properties": {
                  "normalizationStatus": {
                    "const": "REVIEW_REQUIRED"
                  }
                }
              },
              "then": {
                "properties": {
                  "reviewStatus": {
                    "const": "REQUIRED"
                  }
                }
              }
            },
            {
              "if": {
                "properties": {
                  "role": {
                    "const": "AMBIGUOUS"
                  }
                }
              },
              "then": {
                "properties": {
                  "reviewStatus": {
                    "const": "REQUIRED"
                  },
                  "normalizationStatus": {
                    "const": "REVIEW_REQUIRED"
                  }
                }
              }
            }
          ]
        }
      }
    }
