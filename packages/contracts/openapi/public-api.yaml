openapi: 3.1.0
info:
  title: Verified AI Public API
  version: 0.1.0
paths:
  /api/v1/platform/health:
    get:
      summary: Public platform liveness check
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealthResponse"
  /api/v1/platform/readiness:
    get:
      summary: Public platform readiness check
      responses:
        "200":
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealthResponse"
        "503":
          description: API is alive but not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealthResponse"
  /api/v1/auth/apple:
    post:
      summary: Exchange a verified Apple identity credential for a platform session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignInRequest"
      responses:
        "200":
          description: Platform session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Apple identity token is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Refresh token is revoked, expired, invalid, or reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/session:
    get:
      summary: Return the current authenticated user/session identifiers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/logout:
    post:
      summary: Revoke the current backend session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/account:
    get:
      summary: Return the current authenticated account state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStateResponse"
        "401":
          description: Access token is invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/data-exports:
    post:
      summary: Request a retention-aware account data export for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "202":
          description: Export prepared for download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportResponse"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/data-exports/{exportId}:
    get:
      summary: Return status for a current user's data export
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportResponse"
        "404":
          description: Export was not found for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/data-exports/{exportId}/content:
    get:
      summary: Download a ready current-user data export JSON document
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export JSON content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportContent"
        "404":
          description: Export was not found for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "410":
          description: Export expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/deletion-request:
    get:
      summary: Return the current authenticated account deletion state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current deletion request state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
    post:
      summary: Request account deletion for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "202":
          description: Account placed in deletion-requested state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/deletion-request/confirm:
    post:
      summary: Confirm and execute current-user account deletion
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionConfirmationRequest"
      responses:
        "200":
          description: Account deleted, sessions revoked, and local client must discard credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
        "422":
          description: Confirmation text is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/learning-profile:
    get:
      summary: Return the current authenticated learner profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current learner profile or NOT_STARTED profile state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProfileResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      summary: Update the current authenticated learner profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLearningProfileRequest"
      responses:
        "200":
          description: Updated learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProfileResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Expected profile version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Profile validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/entitlements:
    get:
      summary: Return the backend-authoritative current entitlement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current entitlement and currently granted capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/uploads/presign:
    post:
      summary: Reserve a private user-owned problem asset upload and return a presigned PUT URL
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignProblemAssetUploadRequest"
      responses:
        "201":
          description: Upload reservation created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignProblemAssetUploadResponse"
        "400":
          description: Idempotency key or upload request body is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow upload reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Idempotency key was reused with different upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          description: Upload is larger than the Sprint 4.2 server limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Content type, checksum, crop, or asset metadata is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/uploads/{uploadId}/complete:
    post:
      summary: Complete a reserved problem asset upload after backend object verification
      security:
        - bearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Upload verified and marked AVAILABLE, or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteProblemAssetUploadResponse"
        "400":
          description: Idempotency key is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Upload reservation was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Upload object size or checksum does not match the reservation, or state is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "410":
          description: Upload reservation expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Uploaded object is missing or has unsupported content metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/problem-assets/{assetId}/preprocess:
    post:
      summary: Generate backend-owned preprocessing derivatives and capture quality evidence
      description: Synchronously preprocesses an AVAILABLE image asset for Sprint 4.4 recognition input. PDF sources return a recoverable FAILED preprocessing lifecycle response in Sprint 4.3; OCR, parsing, solving, and verification are out of scope.
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current preprocessing lifecycle result, including recoverable FAILED outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemAssetPreprocessingResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account or entitlement does not allow preprocessing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem asset was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Source asset is not AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Source object is missing or preprocessing metadata is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/problem-assets/{assetId}/preprocessing:
    get:
      summary: Read backend-owned preprocessing derivatives and quality evidence for an asset
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current preprocessing lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemAssetPreprocessingResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Problem asset was not found for the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/billing/apple/configuration:
    get:
      summary: Return backend-owned App Store purchase configuration for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Apple billing configuration, including the stable App Account Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleBillingConfigurationResponse"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/me/billing/apple/transactions:
    post:
      summary: Submit StoreKit 2 signed transaction evidence for backend verification
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 96
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplePurchaseEvidenceRequest"
      responses:
        "200":
          description: Verified purchase evidence persisted and entitlement recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplePurchaseEvidenceResponse"
        "400":
          description: Purchase evidence is missing, invalid, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Idempotency key or Apple transaction ownership conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/webhooks/apple/app-store:
    post:
      summary: Receive App Store Server Notifications V2 signedPayload events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleAppStoreNotificationRequest"
      responses:
        "200":
          description: Notification verified, persisted, and processed or safely deduplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleNotificationIngestionResponse"
        "400":
          description: Notification signedPayload is missing or fails Apple signed-data verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppleSignInRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
        authorizationCode:
          type: string
        nonce:
          type: string
    RefreshSessionRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthSessionResponse:
      type: object
      required: [userId, sessionId, tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    CurrentSessionResponse:
      type: object
      required: [userId, sessionId]
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
    LogoutResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [loggedOut]
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED, DELETION_REQUESTED, DELETION_IN_PROGRESS, DELETED]
    AccountStateResponse:
      type: object
      required: [userId, status, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AccountStatus"
        createdAt:
          type: string
          format: date-time
        deletionRequestedAt:
          type: [string, "null"]
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
    DataExportResponse:
      type: object
      required: [exportId, status, schemaVersion, requestedAt, expiresAt]
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
          enum: [READY, EXPIRED, FAILED]
        schemaVersion:
          type: string
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        downloadedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time
    DataExportContent:
      type: object
      required: [schemaVersion, generatedAt, account]
      additionalProperties: true
      properties:
        schemaVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        account:
          type: object
          additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        learningProfile:
          type: object
          additionalProperties: true
        billing:
          type: object
          additionalProperties: true
    DeletionRequestResponse:
      type: object
      required: [userId, status]
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AccountStatus"
        deletionRequestedAt:
          type: [string, "null"]
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time
    DeletionConfirmationRequest:
      type: object
      required: [confirmationText]
      properties:
        confirmationText:
          type: string
          enum: [DELETE]
    UpdateLearningProfileRequest:
      type: object
      properties:
        educationLevel:
          type: [string, "null"]
          enum: [MIDDLE_SCHOOL, HIGH_SCHOOL, UNIVERSITY, OTHER, null]
        preferredLanguage:
          type: [string, "null"]
          enum: [en, tr, null]
        explanationDepth:
          type: [string, "null"]
          enum: [BEGINNER, QUICK, STANDARD, DEEP, null]
        dailyStudyMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 240
        timezone:
          type: [string, "null"]
          maxLength: 64
        goalContext:
          type: [string, "null"]
          maxLength: 160
        completeOnboarding:
          type: boolean
        expectedVersion:
          type: [integer, "null"]
          format: int64
    LearningProfileResponse:
      type: object
      required: [exists, userId, onboardingStatus]
      properties:
        exists:
          type: boolean
        id:
          type: [string, "null"]
          format: uuid
        userId:
          type: string
          format: uuid
        educationLevel:
          type: [string, "null"]
          enum: [MIDDLE_SCHOOL, HIGH_SCHOOL, UNIVERSITY, OTHER, null]
        preferredLanguage:
          type: [string, "null"]
          enum: [en, tr, null]
        explanationDepth:
          type: [string, "null"]
          enum: [BEGINNER, QUICK, STANDARD, DEEP, null]
        dailyStudyMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 240
        timezone:
          type: [string, "null"]
        goalContext:
          type: [string, "null"]
        onboardingStatus:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]
        version:
          type: [integer, "null"]
          format: int64
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
    EntitlementResponse:
      type: object
      required: [id, userId, tier, source, status, effectiveAt, capabilities]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        tier:
          type: string
          enum: [FREE, PRO, PRO_PLUS]
        source:
          type: string
          enum: [DEFAULT_FREE, APP_STORE_SUBSCRIPTION, PROMOTIONAL, ADMIN_SUPPORT]
        status:
          type: string
          enum: [ACTIVE, GRACE_PERIOD, BILLING_RETRY, EXPIRED, REVOKED]
        effectiveAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        capabilities:
          type: array
          items:
            type: string
            enum: [BASIC_SOLVE, VERIFIED_SOLVE, ADVANCED_TUTOR, MISTAKE_HISTORY, ADAPTIVE_PLAN, MOCK_EXAM, PREMIUM_MODEL_FALLBACK]
        version:
          type: [integer, "null"]
          format: int64
    PresignProblemAssetUploadRequest:
      type: object
      required: [source, assetKind, contentType, sizeBytes, checksumSha256]
      properties:
        source:
          type: string
          enum: [camera, photoLibrary, file, pdf]
        assetKind:
          type: string
          enum: [image, pdf]
        contentType:
          type: string
          enum: [image/jpeg, application/pdf]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
        checksumSha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
