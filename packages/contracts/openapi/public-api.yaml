        '503': {$ref: '#/components/responses/Problem'}
  /v1/exams/pre-exam-review/sessions/{sessionId}/export-events:
    post:
      summary: Record an owner-scoped deduplicated on-device PDF export
      description: Feature disabled returns 403; absent, expired or foreign sessions return 404. No PDF is uploaded.
      security: [{bearerAuth: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '.*\S.*'}}
      responses:
        '204':
          description: Event accepted or previously recorded for this owner and session
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
        '400': {$ref: '#/components/responses/ProblemBadRequest'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '404': {$ref: '#/components/responses/ProblemNotFound'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
