components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ProblemBadRequest:
      description: Bad request or validation failure
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemUnauthorized:
      description: Authentication token is missing, invalid, or expired
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemForbidden:
      description: Access forbidden; insufficient administrative role or permissions
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemNotFound:
      description: Requested resource was not found or access forbidden
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemConflict:
      description: Conflict with current state of resource
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemUnprocessableEntity:
      description: Domain rule violation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemServiceUnavailable:
      description: Service feature disabled or temporarily unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemPayloadTooLarge:
      description: Uploaded payload exceeds maximum permitted byte limit
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemUnsupportedMediaType:
      description: Uploaded media magic bytes or MIME type are unsupported
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ProblemTooManyRequests:
      description: Rolling upload or rate quota exceeded
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Problem:
      description: "Stable Problem Details: 401 authentication; 403 ACCOUNT_NOT_ACTIVE; 404 RESOURCE_FORBIDDEN/ATTEMPT_NOT_FOUND; 409 ATTEMPT_STALE_SOURCE/OPTIMISTIC_CONFLICT/IDEMPOTENCY_KEY_REUSED/ATTEMPT_CAPACITY_EXCEEDED; 413 REQUEST_TOO_LARGE; 422 REQUEST_VALIDATION_FAILED; 429 RATE_LIMIT_EXCEEDED; 503 ATTEMPT_UNAVAILABLE. Retry uncertain failures with the same key and exact body. Includes traceId."
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    TutorFailure:
      description: "Stable Problem Details: 400 REQUEST_VALIDATION_FAILED/IDEMPOTENCY_KEY_REQUIRED; 401 authentication; 403 ACCOUNT_NOT_ACTIVE; 404 TUTOR_NOT_FOUND/RESOURCE_FORBIDDEN (foreign and absent indistinguishable); 409 TUTOR_SOURCE_NOT_READY/TUTOR_SOURCE_STALE/TUTOR_SESSION_CLOSED/TUTOR_CAPACITY_EXCEEDED/IDEMPOTENCY_KEY_REUSED; 413 REQUEST_TOO_LARGE; 422 REQUEST_VALIDATION_FAILED; 429 RATE_LIMIT_EXCEEDED; 503 TEMPORARY_UNAVAILABLE. Existing correlation/trace identifiers apply. Retry only uncertain/temporary failures with the same key and payload."
