  /v1/exams/sessions/{sessionId}/attribution-report:
    get:
      summary: Read deterministic H-03 attribution
      security: [{bearerAuth: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Accept-Language, in: header, schema: {type: string, default: tr}}
      responses:
        '200':
          description: Owner-scoped result; no-store. Replay returns the persisted response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamAttributionReport'}
        '400': {description: Invalid request or missing idempotency key}
        '401': {description: Authentication required}
        '403': {description: FEATURE_DISABLED}
        '404': {description: Session absent or owned by another learner}
        '409': {description: SESSION_NOT_SCORED, key conflict, or no available remediation capacity}
        default: {$ref: '#/components/responses/Problem'}
  /v1/exams/sessions/{sessionId}/apply-study-rebalance:
    post:
      summary: Rebalance the next seven days using H-03 ROI
      security: [{bearerAuth: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '.*\S.*'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExamStudyRebalanceRequest'}
      responses:
        '200':
          description: Owner-scoped result; no-store. Replay returns the persisted response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamStudyRebalanceResponse'}
        '400': {description: Invalid request or missing idempotency key}
        '401': {description: Authentication required}
        '403': {description: FEATURE_DISABLED}
        '404': {description: Session absent or owned by another learner}
        '409': {description: SESSION_NOT_SCORED, key conflict, or no available remediation capacity}
        default: {$ref: '#/components/responses/Problem'}
