      type: object
      additionalProperties: false
      required: [id, text, explicit, sourceBlockIds]
      properties:
        id:
          type: string
        text:
          type: string
        explicit:
          type: boolean
          enum: [true]
        sourceBlockIds:
          type: array
          items:
            type: string

    ProblemParseUncertainty:
      type: object
      additionalProperties: false
      required: [recognition, parse, reviewRequired]
      properties:
        recognition:
          type: array
          items:
            type: string
        parse:
          type: array
          items:
            type: string
        reviewRequired:
          type: boolean

    ProblemParseSourceEvidenceRef:
      type: object
      additionalProperties: false
      required: [blockId, fieldPath]
      properties:
        blockId:
          type: string
        fieldPath:
          type: string

    ProblemParseVisualQualityRisk:
      type: object
      additionalProperties: false
      required: [signalType, severity]
      properties:
        signalType:
          type: string
        severity:
          type: string
          enum: [PASS, WARNING, BLOCKING]
        messageCode:
          type: [string, "null"]

    AppleBillingConfigurationResponse:
      type: object
      required: [appAccountToken, purchaseAvailable, environment, products]
      properties:
        appAccountToken:
          type: string
          format: uuid
        purchaseAvailable:
          type: boolean
        environment:
          type: string
          enum: [XCODE, LOCAL_TESTING, SANDBOX, PRODUCTION]
        products:
          type: array
          items:
            $ref: "#/components/schemas/AppleBillingProductResponse"

    AppleBillingProductResponse:
      type: object
      required: [internalPlanId, appStoreProductId, entitlementTier]
      properties:
        internalPlanId:
          type: string
        appStoreProductId:
          type: string
        entitlementTier:
          type: string
          enum: [FREE, PRO, PRO_PLUS]
        subscriptionGroupId:
          type: [string, "null"]
        billingPeriod:
          type: [string, "null"]

    ApplePurchaseEvidenceRequest:
      type: object
      required: [signedTransactionInfo]
      properties:
        signedTransactionInfo:
          type: string
        source:
          type: [string, "null"]

    ApplePurchaseEvidenceResponse:
      type: object
      required: [transactionId, originalTransactionId, subscriptionStatus, entitlement, duplicate]
      properties:
        transactionId:
          type: string
        originalTransactionId:
          type: string
        subscriptionStatus:
          type: string
          enum: [ACTIVE, GRACE_PERIOD, BILLING_RETRY, EXPIRED, REVOKED]
        entitlement:
          $ref: "#/components/schemas/EntitlementResponse"
        duplicate:
          type: boolean

    AppleAppStoreNotificationRequest:
      type: object
      required: [signedPayload]
      properties:
        signedPayload:
          type: string

    AppleNotificationIngestionResponse:
      type: object
      required: [processingStatus]
      properties:
        notificationUuid:
          type: [string, "null"]
        processingStatus:
          type: string
          enum: [RECEIVED, PROCESSING, PROCESSED, FAILED_RETRYABLE, FAILED_TERMINAL]
        subscriptionStatus:
          type: [string, "null"]
          enum: [ACTIVE, GRACE_PERIOD, BILLING_RETRY, EXPIRED, REVOKED, null]
        entitlement:
          anyOf:
            - $ref: "#/components/schemas/EntitlementResponse"
            - type: "null"

    PlatformHealthResponse:
      type: object
      required: [status, service, environment, correlationId, timestamp]
      properties:
        status:
          type: string
          enum: [UP, READY, NOT_READY]
        service:
          type: string
        environment:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId, details]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
