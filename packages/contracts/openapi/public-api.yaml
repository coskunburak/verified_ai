      security: [{bearerAuth: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Session-scoped integrity proof metadata and ephemeral derived key
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamIntegrityProofResponse'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '404': {$ref: '#/components/responses/ProblemNotFound'}
        '409': {$ref: '#/components/responses/ProblemConflict'}
        '429': {$ref: '#/components/responses/ProblemTooManyRequests'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/ProblemServiceUnavailable'}
  /v1/analytics/exams/progress:
    get:
      summary: Read longitudinal exam progress analytics, topic pacing, and trap remediation correlation (INV-EXAM-005)
      security: [{bearerAuth: []}]
      parameters:
        - {name: examCode, in: query, required: true, schema: {type: string, enum: [TR_YKS_TYT_MATH, TR_YKS_AYT_MATH, YKS_TYT, YKS_TYT_MATH, YKS_AYT_SAY, YKS_AYT, YKS_AYT_MATH]}}
      responses:
        '200':
          description: Owner-scoped deterministic longitudinal exam progress report
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamAnalyticsProgressReport'}
        '400': {$ref: '#/components/responses/ProblemBadRequest'}
        '401': {$ref: '#/components/responses/ProblemUnauthorized'}
        '403': {$ref: '#/components/responses/ProblemForbidden'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
