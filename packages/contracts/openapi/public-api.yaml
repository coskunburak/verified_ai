  /api/v1/problem-sessions/{problemId}/visualizations/context:
    parameters:
      - {name: problemId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{bearerAuth: []}]
      summary: Read current owned visualization source identity; no attempt is created
      responses:
        '200':
          description: Current source identity and independent feature availability
          content:
            application/json:
              schema: {$ref: '../../schemas/math-visualization-context-v1.schema.json'}
        '401': {description: Authentication required}
        '404': {description: Source not owned}
        '409': {description: Source not ready}
  /api/v1/problem-sessions/{problemId}/visualizations:
    parameters:
      - {name: problemId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{bearerAuth: []}]
      summary: Ephemeral deterministic source projection, no solve, attempt, debit or verification mutation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../../schemas/math-visualization-source-v1.schema.json'}
      responses:
        '200':
          description: Exact source facts and bounded approximate samples; unsupported and unavailable carry no plot
          content:
            application/json:
              schema: {$ref: '../../schemas/math-visualization-public-v1.schema.json'}
        '401': {description: Authentication required}
        '403': {description: Account inactive}
        '404': {description: Source not owned}
        '409': {description: VISUALIZATION_STALE_SOURCE or SOLVE_SOURCE_NOT_READY; reload context}
        '413': {description: REQUEST_TOO_LARGE; maximum 16384 bytes}
        '422': {description: REQUEST_VALIDATION_FAILED}
        '429': {description: RATE_LIMIT_EXCEEDED; twenty requests per minute}
        '503': {description: VISUALIZATION_UNAVAILABLE; disabled or invalid worker response}
  /api/v1/problem-sessions/{sessionId}/attempts/{attemptId}/counterfactual-twin:
    parameters:
      - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{bearerAuth: []}]
      summary: Create or resume one independently verified twin per attempt
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: "^[A-Za-z0-9_-]{8,128}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "200":
          description: Owned authoritative result; trainingEligible is false
          content:
            application/json:
              schema: {$ref: '../../schemas/counterfactual-twin-v1.schema.json'}
        "401": {description: Authentication required}
        "404": {description: Owned resource unavailable}
        "409": {description: Source or idempotency conflict}
        "413": {description: Request exceeds 16 KiB}
        "422": {description: Invalid strict request}
        "429": {description: Account rate limit}
        "503": {description: Feature disabled or verified artifact unavailable}
