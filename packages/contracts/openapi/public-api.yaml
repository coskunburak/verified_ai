    parameters:
      - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: tutorSessionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: submitSocraticTutorTurn
      security: [{bearerAuth: []}]
      summary: Submit one learner contribution and atomically persist deterministic guidance
      description: >-
        Local rule-based policy only; AI TUTOR remains disabled. Requires active owned current source.
        A single local transaction commits the learner message and TUTOR reply or neither. No pending
        server job or external dispatch exists. Retry the exact content and intent using the same key.
        A committed retry is readable after close, staleness or feature disable; a changed payload or
        key reused across legacy append and turn operations yields IDEMPOTENCY_KEY_REUSED (409).
        UNKNOWN intent permits conservative exact-phrase classification, never correctness assessment.
        Terminal pedagogical states require a new session. Twelve turns maximum, 100 combined learner
        messages and tutor replies; messageCount continues to count only v1 learner messages.
        Body maximum 16384 bytes; content maximum 8000 UTF-8 bytes / 2000 Unicode code points.
        Uses the existing fail-closed 120 requests/account/minute limit and correlation infrastructure.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TutorTurnRequest'}
      responses:
        '200':
          description: Committed reply or exact replay; correctness remains UNKNOWN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TutorTurn'}
        '400': {$ref: '#/components/responses/TutorFailure'}
        '401': {$ref: '#/components/responses/TutorFailure'}
        '404': {$ref: '#/components/responses/TutorFailure'}
        '409':
          description: TUTOR_SESSION_CLOSED, TUTOR_SOURCE_STALE, TUTOR_CAPACITY_EXCEEDED, TUTOR_PEDAGOGY_STOPPED or IDEMPOTENCY_KEY_REUSED
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '413': {$ref: '#/components/responses/TutorFailure'}
        '422': {$ref: '#/components/responses/TutorFailure'}
        '429': {$ref: '#/components/responses/TutorFailure'}
        '503':
          description: TUTOR_CAPABILITY_UNAVAILABLE (definitive non-commit) or TEMPORARY_UNAVAILABLE (retry same key)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
