  /api/v1/mastery/skills:
    get:
      summary: Read authenticated learner mastery and evidence quality
      parameters:
        - in: query
          name: representationVersion
          schema: {type: integer, enum: [1, 2], default: 1}
          description: Version 1 preserves the original strict response shape. Version 2 requests the temporal extension.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Owner-scoped snapshot at asOf. Disabled mastery returns empty arrays. The temporal extension is absent when disabled or on older servers. When present, retentionScore and confidence equal retention and evidenceConfidence. reassessmentDue and its reason come from the server. Reads never record learning evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MasterySkillsView"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/mistakes/dna:
    get:
      summary: Read effective mistake state
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Owner scoped result. Correction requires explicit re-evaluation. FREE DNA reads contain at most two profiles and no ledger entries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MistakeDnaView"}
        default: {$ref: "#/components/responses/Problem"}
  /api/v1/mistakes/{eventId}/effective-state:
    get:
