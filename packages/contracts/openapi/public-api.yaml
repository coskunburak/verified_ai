    ExamAttributionReport:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://verifiedai.com/schemas/exam/v1/exam-attribution-report.schema.json
      title: exam-attribution-report
      type: object
      additionalProperties: false
      required:
      - sessionId
      - userId
      - examCode
      - generatedAt
      - algorithmVersion
      - totalLostNet
      - categorySummary
      - topRoiAllocations
      - itemAttributions
      - studyPlanRebalanced
      - lastReallocationBatchId
      - trainingEligible
      properties:
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        examCode:
          type: string
          minLength: 1
        generatedAt:
          type: string
          format: date-time
        algorithmVersion:
          const: H03_ATTRIBUTION_V1
        totalLostNet:
          type: number
          minimum: 0
        categorySummary:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - category
            - itemCount
            - lostNet
            - sharePercentage
            - headline
            properties:
              category:
                enum:
                - CONCEPTUAL_GAP
                - RECURRING_MISTAKE_TRAP
                - TIME_PRESSURE_SLIP
                - STRATEGIC_OMISSION
              itemCount:
                type: integer
                minimum: 0
              lostNet:
                type: number
                minimum: 0
              sharePercentage:
                type: number
                minimum: 0
                maximum: 100
              headline:
                type: string
                minLength: 1
          minItems: 4
          maxItems: 4
        topRoiAllocations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - rank
            - topicId
            - skillId
            - expectedNetGainPerHour
            - estimatedRemediationHours
            - recommendedActionType
            - recommendedTargetRef
            - topicTitle
            - skillTitle
            - dominantCategory
            - matchedMistakeCode
            - sessionLostNet
            - currentMastery
            - examSuccessProbability
            - estimatedNetRecoveryTotal
            - rationale
            properties:
              rank:
                type: integer
                minimum: 1
                maximum: 3
              topicId:
                type: string
                minLength: 1
              skillId:
                type: string
                minLength: 1
              expectedNetGainPerHour:
                type: number
                minimum: 0
              estimatedRemediationHours:
                type: number
                minimum: 0.5
              recommendedActionType:
                enum:
                - MICRO_LESSON
                - TWIN_DRILL
                - TIMED_SPEED_DRILL
                - TRIAGE_STRATEGY_REVIEW
              recommendedTargetRef:
                type: string
                minLength: 1
              topicTitle:
                type: string
                minLength: 1
              skillTitle:
                type: string
                minLength: 1
              dominantCategory:
                enum:
                - CONCEPTUAL_GAP
                - RECURRING_MISTAKE_TRAP
                - TIME_PRESSURE_SLIP
                - STRATEGIC_OMISSION
              matchedMistakeCode:
                type:
                - string
                - 'null'
              sessionLostNet:
                type: number
                minimum: 0
              currentMastery:
                type: number
                minimum: 0
                maximum: 1
              examSuccessProbability:
                type: number
                minimum: 0
                maximum: 1
              estimatedNetRecoveryTotal:
                type: number
                minimum: 0
              rationale:
                type: string
                minLength: 1
          maxItems: 3
        itemAttributions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - attributionId
            - itemEvaluationId
            - itemOrder
            - sectionCode
            - topicId
            - skillId
            - itemOutcome
            - attributionCategory
            - matchedMistakeCode
            - evidenceSource
            - timeSpentSeconds
            - expectedSolveSeconds
            - masterySnapshot
            - estimatedNetImpact
            - recommendedActionType
            - recommendedTargetRef
            - rationale
            properties:
              attributionId:
                type: string
                format: uuid
              itemEvaluationId:
                type: string
                format: uuid
              itemOrder:
                type: integer
                minimum: 1
              sectionCode:
                type: string
                minLength: 1
              topicId:
                type: string
                minLength: 1
              skillId:
                type: string
                minLength: 1
              itemOutcome:
                enum:
                - WRONG
                - OMITTED
              attributionCategory:
                enum:
                - CONCEPTUAL_GAP
                - RECURRING_MISTAKE_TRAP
                - TIME_PRESSURE_SLIP
                - STRATEGIC_OMISSION
              matchedMistakeCode:
                type:
                - string
                - 'null'
              evidenceSource:
                enum:
                - SCRATCHPAD_STEP_DIAGNOSIS
                - DISTRACTOR_TRAP_MAP
                - MISTAKE_DNA_PROFILE
                - MASTERY_THRESHOLD
                - TIMING_HEURISTIC
                - OMISSION_DEFAULT
              timeSpentSeconds:
                type: integer
                minimum: 0
              expectedSolveSeconds:
                type: integer
                minimum: 1
              masterySnapshot:
                type: number
                minimum: 0
                maximum: 1
              estimatedNetImpact:
                type: number
                minimum: 0
                maximum: 5
              recommendedActionType:
                enum:
                - MICRO_LESSON
                - TWIN_DRILL
                - TIMED_SPEED_DRILL
                - TRIAGE_STRATEGY_REVIEW
              recommendedTargetRef:
                type: string
                minLength: 1
              rationale:
                type: string
                minLength: 1
        studyPlanRebalanced:
          type: boolean
        lastReallocationBatchId:
          type:
          - string
          - 'null'
          format: uuid
        trainingEligible:
          const: false
    ExamStudyRebalanceRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://verifiedai.com/schemas/exam/v1/exam-study-rebalance-request.schema.json
      title: exam-study-rebalance-request
      type: object
      additionalProperties: false
      required:
      - maxTopicsToApply
      - targetHorizonDays
      - preferredDailyMinutes
      properties:
        maxTopicsToApply:
          type: integer
          minimum: 1
          maximum: 3
        targetHorizonDays:
          const: 7
        preferredDailyMinutes:
          type: integer
          minimum: 5
          maximum: 240
    ExamStudyRebalanceResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://verifiedai.com/schemas/exam/v1/exam-study-rebalance-response.schema.json
      title: exam-study-rebalance-response
      type: object
      additionalProperties: false
      required:
      - batchId
      - sourceSessionId
      - userId
      - examCode
      - appliedToStudyPlan
      - idempotentReplay
      - rebalancedStudyPlanId
      - rebalancedTasksCount
      - totalExpectedNetRecovery
      - appliedDirectives
      - appliedAt
      - trainingEligible
      properties:
        batchId:
          type: string
          format: uuid
        sourceSessionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        examCode:
          type: string
          minLength: 1
        appliedToStudyPlan:
          const: true
        idempotentReplay:
          type: boolean
        rebalancedStudyPlanId:
          type: string
          format: uuid
        rebalancedTasksCount:
          type: integer
          minimum: 1
          maximum: 21
        totalExpectedNetRecovery:
          type: number
          minimum: 0
        appliedDirectives:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - rank
            - topicId
            - skillId
            - expectedNetGainPerHour
            - estimatedRemediationHours
            - recommendedActionType
            - recommendedTargetRef
            properties:
              rank:
                type: integer
                minimum: 1
                maximum: 3
              topicId:
                type: string
                minLength: 1
              skillId:
                type: string
                minLength: 1
              expectedNetGainPerHour:
                type: number
                minimum: 0
              estimatedRemediationHours:
                type: number
                minimum: 0.5
              recommendedActionType:
                enum:
                - MICRO_LESSON
                - TWIN_DRILL
                - TIMED_SPEED_DRILL
                - TRIAGE_STRATEGY_REVIEW
              recommendedTargetRef:
                type: string
                minLength: 1
          minItems: 1
          maxItems: 3
        appliedAt:
          type: string
          format: date-time
        trainingEligible:
          const: false
    TrapLifecycleStatus:
      type: string
      enum:
        - RECURRING_PATTERN
        - IN_REMEDIATION
        - RESOLVED_PENDING_RETENTION
        - STABLE_RESOLVED

