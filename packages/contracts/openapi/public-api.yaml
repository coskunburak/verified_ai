  /api/v1/problem-sessions/{sessionId}/calculus-parse-revisions:
    post:
      summary: Admit a typed calculus USER source revision
      description: Additive problem-parse-v2 correction bound to the selected parse and existing recognition evidence. Does not invoke a model or verify a solution. Duplicate JSON keys and unknown fields are rejected. Canonicalization remains explicit.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baseParseId, baseRevision, correctionReason, problem]
              properties:
                baseParseId:
                  type: string
                  format: uuid
                baseRevision:
                  type: integer
                  minimum: 1
                correctionReason:
                  type: string
                  enum: [OCR_TEXT_ERROR, MATH_EXPRESSION_ERROR, VARIABLE_ERROR, CONSTRAINT_ERROR, ASSUMPTION_ERROR, TASK_TYPE_ERROR, PROBLEM_TYPE_ERROR, OTHER]
                problem:
                  $ref: "../../schemas/problem-parse-v2.schema.json"
      responses:
        "201":
          description: New immutable USER revision selected, or idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProblemParseCorrectionResponse"
        "400":
          description: Malformed typed source or missing idempotency key
        "401":
          description: Authentication required
        "403":
          description: Account or entitlement denied
        "404":
          description: Owned session not found
        "409":
          description: Source revision or idempotency conflict
        "422":
          description: Invalid source semantics or provenance
