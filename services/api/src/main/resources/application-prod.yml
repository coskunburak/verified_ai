spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
app:
  environment: production
  ai:
    vision-recognition:
      enabled: ${AI_VISION_RECOGNITION_ENABLED:false}
management:
  endpoint:
    health:
      show-details: never
