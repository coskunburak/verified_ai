spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
app:
  environment: staging

  ai:
    vision-recognition:
      enabled: ${AI_VISION_RECOGNITION_ENABLED:false}
      release-stage: ${AI_VISION_RECOGNITION_RELEASE_STAGE:STAGING}
    problem-parser:
      enabled: ${AI_PROBLEM_PARSER_ENABLED:false}
      release-stage: ${AI_PROBLEM_PARSER_RELEASE_STAGE:STAGING}
    problem-classifier:
      enabled: ${AI_PROBLEM_CLASSIFIER_ENABLED:false}
      release-stage: ${AI_PROBLEM_CLASSIFIER_RELEASE_STAGE:STAGING}
