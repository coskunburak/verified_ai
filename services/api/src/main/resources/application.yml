spring:
  application:
    name: verified-ai-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verified_ai}
    username: ${POSTGRES_USER:verified_ai_local}
    password: ${POSTGRES_PASSWORD:local_dev_password_change_me}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
  flyway:
    enabled: true
    locations: classpath:db/migration/platform
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${API_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      service: verified-ai-api
app:
  environment: ${APP_ENV:local}
  ai:
    vision-recognition:
      enabled: ${AI_VISION_RECOGNITION_ENABLED:true}
      primary-provider: ${AI_VISION_RECOGNITION_PRIMARY_PROVIDER:LOCAL_FIXTURE}
      fallback-provider: ${AI_VISION_RECOGNITION_FALLBACK_PROVIDER:}
      route-policy-version: ${AI_VISION_RECOGNITION_ROUTE_POLICY_VERSION:vision-route-v1}
      prompt-id: ${AI_VISION_RECOGNITION_PROMPT_ID:vision-recognition}
      prompt-version: ${AI_VISION_RECOGNITION_PROMPT_VERSION:v001}
      schema-version: ${AI_VISION_RECOGNITION_SCHEMA_VERSION:recognition-evidence-v1}
      timeout: ${AI_VISION_RECOGNITION_TIMEOUT:PT20S}
      max-attempts: ${AI_VISION_RECOGNITION_MAX_ATTEMPTS:2}
      max-response-bytes: ${AI_VISION_RECOGNITION_MAX_RESPONSE_BYTES:65536}
      max-cost-micros: ${AI_VISION_RECOGNITION_MAX_COST_MICROS:20000}
      pricing-version: ${AI_VISION_RECOGNITION_PRICING_VERSION:vision-recognition-local-v1}
  problem-recognition:
    max-input-bytes: ${PROBLEM_RECOGNITION_MAX_INPUT_BYTES:10485760}
    max-blocks: ${PROBLEM_RECOGNITION_MAX_BLOCKS:128}
    max-text-chars-per-block: ${PROBLEM_RECOGNITION_MAX_TEXT_CHARS_PER_BLOCK:2000}
    max-total-text-chars: ${PROBLEM_RECOGNITION_MAX_TOTAL_TEXT_CHARS:12000}
    coordinate-tolerance: ${PROBLEM_RECOGNITION_COORDINATE_TOLERANCE:0.000001}
    stuck-running-timeout: ${PROBLEM_RECOGNITION_STUCK_RUNNING_TIMEOUT:PT2M}
    worker-interval: ${PROBLEM_RECOGNITION_WORKER_INTERVAL:PT5S}
  verifier:
    base-url: ${MATH_VERIFIER_BASE_URL:http://localhost:8090}
    internal-token: ${MATH_VERIFIER_INTERNAL_TOKEN:local_math_verifier_token_change_me}
  billing:
    apple:
      enabled: ${APPLE_BILLING_ENABLED:false}
      purchase-available: ${APPLE_PURCHASE_AVAILABLE:false}
      environment: ${APPLE_BILLING_ENVIRONMENT:XCODE}
      bundle-id: ${APPLE_BILLING_BUNDLE_ID:com.verifiedai.learning}
      app-apple-id: ${APPLE_APP_APPLE_ID:0}
      issuer-id: ${APP_STORE_CONNECT_ISSUER_ID:}
      key-id: ${APP_STORE_CONNECT_KEY_ID:}
      private-key-pem: ${APP_STORE_CONNECT_PRIVATE_KEY_PEM:}
      root-certificate-pem: []
      products: []
  problem-assets:
    bucket: ${PROBLEM_ASSETS_BUCKET:verified-ai-problem-assets-local}
    endpoint: ${PROBLEM_ASSETS_S3_ENDPOINT:}
    region: ${PROBLEM_ASSETS_S3_REGION:us-east-1}
    access-key: ${PROBLEM_ASSETS_S3_ACCESS_KEY:}
    secret-key: ${PROBLEM_ASSETS_S3_SECRET_KEY:}
    path-style-access: ${PROBLEM_ASSETS_S3_PATH_STYLE:true}
    presign-ttl: ${PROBLEM_ASSETS_PRESIGN_TTL:PT15M}
    max-size-bytes: ${PROBLEM_ASSETS_MAX_SIZE_BYTES:20971520}
    allowed-content-types:
      - image/jpeg
      - application/pdf
    pending-retention: ${PROBLEM_ASSETS_PENDING_RETENTION:P30D}
    cleanup-interval: ${PROBLEM_ASSETS_CLEANUP_INTERVAL:PT1H}
    preprocessing:
      processor-name: ${PROBLEM_ASSETS_PREPROCESSOR_NAME:DOCUMENT_PREPROCESSOR}
      processor-version: ${PROBLEM_ASSETS_PREPROCESSOR_VERSION:1.0}
      configuration-version: ${PROBLEM_ASSETS_PREPROCESSING_CONFIGURATION_VERSION:capture-quality-v1}
      max-source-bytes: ${PROBLEM_ASSETS_PREPROCESSING_MAX_SOURCE_BYTES:20971520}
      max-decode-pixels: ${PROBLEM_ASSETS_PREPROCESSING_MAX_DECODE_PIXELS:36000000}
      ocr-optimized-max-long-edge: ${PROBLEM_ASSETS_PREPROCESSING_OCR_MAX_LONG_EDGE:2400}
      thumbnail-max-long-edge: ${PROBLEM_ASSETS_PREPROCESSING_THUMBNAIL_MAX_LONG_EDGE:360}
      jpeg-quality: ${PROBLEM_ASSETS_PREPROCESSING_JPEG_QUALITY:0.92}
      min-crop-pixels: ${PROBLEM_ASSETS_PREPROCESSING_MIN_CROP_PIXELS:32}
      blur-variance-warning: ${PROBLEM_ASSETS_PREPROCESSING_BLUR_VARIANCE_WARNING:90}
      glare-cell-saturation-ratio: ${PROBLEM_ASSETS_PREPROCESSING_GLARE_CELL_SATURATION_RATIO:0.30}
      glare-overall-saturation-max: ${PROBLEM_ASSETS_PREPROCESSING_GLARE_OVERALL_SATURATION_MAX:0.60}
      contrast-std-dev-warning: ${PROBLEM_ASSETS_PREPROCESSING_CONTRAST_STD_DEV_WARNING:28}
      resolution-min-long-edge: ${PROBLEM_ASSETS_PREPROCESSING_RESOLUTION_MIN_LONG_EDGE:900}
  auth:
    apple:
      issuer: ${APPLE_IDENTITY_ISSUER:https://appleid.apple.com}
      audience: ${APPLE_CLIENT_ID:com.verifiedai.learning}
      jwk-set-uri: ${APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
    access-token:
      issuer: ${ACCESS_TOKEN_ISSUER:verified-ai-api}
      ttl: ${ACCESS_TOKEN_TTL:PT15M}
      private-key-pem: ${ACCESS_TOKEN_PRIVATE_KEY_PEM:}
      public-key-pem: ${ACCESS_TOKEN_PUBLIC_KEY_PEM:}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:P30D}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
