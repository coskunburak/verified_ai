spring:
  application:
    name: verified-ai-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verified_ai}
    username: ${POSTGRES_USER:verified_ai_local}
    password: ${POSTGRES_PASSWORD:local_dev_password_change_me}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
  flyway:
    enabled: true
    locations: classpath:db/migration/platform
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${API_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      service: verified-ai-api
app:
  environment: ${APP_ENV:local}
  verifier:
    base-url: ${MATH_VERIFIER_BASE_URL:http://localhost:8090}
    internal-token: ${MATH_VERIFIER_INTERNAL_TOKEN:local_math_verifier_token_change_me}
  billing:
    apple:
      enabled: ${APPLE_BILLING_ENABLED:false}
      purchase-available: ${APPLE_PURCHASE_AVAILABLE:false}
      environment: ${APPLE_BILLING_ENVIRONMENT:XCODE}
      bundle-id: ${APPLE_BILLING_BUNDLE_ID:com.verifiedai.learning}
      app-apple-id: ${APPLE_APP_APPLE_ID:0}
      issuer-id: ${APP_STORE_CONNECT_ISSUER_ID:}
      key-id: ${APP_STORE_CONNECT_KEY_ID:}
      private-key-pem: ${APP_STORE_CONNECT_PRIVATE_KEY_PEM:}
      root-certificate-pem: []
      products: []
  problem-assets:
    bucket: ${PROBLEM_ASSETS_BUCKET:verified-ai-problem-assets-local}
    endpoint: ${PROBLEM_ASSETS_S3_ENDPOINT:}
    region: ${PROBLEM_ASSETS_S3_REGION:us-east-1}
    access-key: ${PROBLEM_ASSETS_S3_ACCESS_KEY:}
    secret-key: ${PROBLEM_ASSETS_S3_SECRET_KEY:}
    path-style-access: ${PROBLEM_ASSETS_S3_PATH_STYLE:true}
    presign-ttl: ${PROBLEM_ASSETS_PRESIGN_TTL:PT15M}
    max-size-bytes: ${PROBLEM_ASSETS_MAX_SIZE_BYTES:20971520}
    allowed-content-types:
      - image/jpeg
      - application/pdf
    pending-retention: ${PROBLEM_ASSETS_PENDING_RETENTION:P30D}
    cleanup-interval: ${PROBLEM_ASSETS_CLEANUP_INTERVAL:PT1H}
  auth:
    apple:
      issuer: ${APPLE_IDENTITY_ISSUER:https://appleid.apple.com}
      audience: ${APPLE_CLIENT_ID:com.verifiedai.learning}
      jwk-set-uri: ${APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
    access-token:
      issuer: ${ACCESS_TOKEN_ISSUER:verified-ai-api}
      ttl: ${ACCESS_TOKEN_TTL:PT15M}
      private-key-pem: ${ACCESS_TOKEN_PRIVATE_KEY_PEM:}
      public-key-pem: ${ACCESS_TOKEN_PUBLIC_KEY_PEM:}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:P30D}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
