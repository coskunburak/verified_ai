spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verified_ai_test}
  flyway:
    clean-disabled: false
app:
  ai:
    usage-ledger:
      enabled: false
verifiedai:
  studyplan:
    session-orchestration-enabled: true
    gamification-enabled: true
    cold-start-enabled: true
    session-inactivity-ttl-hours: 24
    session-clock-skew-tolerance-seconds: 30
    session-max-active-duration-seconds: 14400
  analytics:
    weekly-digest-enabled: true
  exam:
    catalog-enabled: true
    target-binding-enabled: true
    candidate-profile-enabled: true
    syllabus-ingestion-enabled: true
    syllabus-monthly-quota: 3
    syllabus-retention-days: 30
    syllabus-similarity-threshold: 0.70
    syllabus-live-ai-enabled: false
    default-jurisdiction: TR
    question-bank-enabled: true
    blueprint-management-enabled: true
    assessment-assembly-enabled: true
    session-runtime-enabled: true
    scoring-engine-enabled: true
